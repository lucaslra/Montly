name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mcp-server/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mcp-server/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: cd backend && go test ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Test
        run: cd frontend && npm test

  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: mcp-server/go.mod
          cache-dependency-path: mcp-server/go.sum

      - name: Test
        run: cd mcp-server && go test ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend, mcp-server]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build montly image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

      - name: Build montly-mcp image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          push: false
