name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create GitHub release
  packages: write   # push to ghcr.io

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changes since last tag
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.check.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if mcp-server changed
        id: check
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV_TAG"..HEAD | grep -qE '^mcp-server/'; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

  montly:
    name: Build & publish montly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/montly
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=montly
          cache-to: type=gha,scope=montly,mode=max

  mcp-build:
    name: Build & publish montly-mcp
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/montly-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  mcp-retag:
    name: Retag montly-mcp (unchanged)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'false'
    steps:
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/montly-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag latest image to new version
        run: |
          SRC="ghcr.io/${{ github.repository_owner }}/montly-mcp:latest"
          TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create $TAGS "$SRC"

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [montly, mcp-build, mcp-retag]
    if: always() && !contains(needs.montly.result, 'failure') && !contains(needs.mcp-build.result, 'failure') && !contains(needs.mcp-retag.result, 'failure')
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/montly
          tags: type=semver,pattern={{version}}

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo "body<<EOF"
            awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Docker

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/montly:${{ steps.meta.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/montly-mcp:${{ steps.meta.outputs.version }}
            ```

            ${{ steps.changelog.outputs.body }}
