# E2E test stack — not for production use.
# Run via: make e2e
services:
  # Mock OpenID Connect provider (zero-dependency Node script) so the SSO flow
  # can be exercised end-to-end. Both the app and the Playwright browser run in
  # this Docker network, so they share one issuer hostname (mock-oidc:9000).
  mock-oidc:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./e2e/mock-oidc:/app
    environment:
      PORT: "9000"
      ISSUER: "http://mock-oidc:9000"
      OIDC_USERNAME: "e2e-sso"
      OIDC_EMAIL: "e2e-sso@example.com"
      OIDC_GROUPS: "montly-admins"
    command: node server.mjs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/.well-known/openid-configuration || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  app:
    build: .
    environment:
      DATA_DIR: /data
      PORT: "8080"
      # SSO wired to the mock IdP. Password login stays enabled (hybrid).
      OIDC_ISSUER: "http://mock-oidc:9000"
      OIDC_CLIENT_ID: "montly-e2e"
      OIDC_CLIENT_SECRET: "e2e-secret"
      OIDC_REDIRECT_URL: "http://app:8080/api/auth/oidc/callback"
      OIDC_PROVIDER_NAME: "Mock SSO"
      OIDC_ADMIN_GROUP: "montly-admins"
    volumes:
      - e2e_data:/data
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      mock-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/auth/setup || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
      ADMIN_USER: e2eadmin
      ADMIN_PASS: e2epassword123
    command: sh -c "npm install --silent && npx playwright test"

volumes:
  e2e_data:
